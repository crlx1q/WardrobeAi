<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capsule · Админ-панель</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --surface: #fdf8f8;
      --surface-container-lowest: #ffffff;
      --surface-container-low: #f7f3f2;
      --surface-container: #f1edec;
      --surface-container-high: #ebe7e6;
      --on-surface: #1c1b1b;
      --on-surface-variant: #444748;
      --outline: #747878;
      --outline-variant: #c4c7c7;
      --primary: #000000;
      --on-primary: #ffffff;
      --accent: #a77b4e;
      --error: #ba1a1a;
      --success: #2e7d32;
      --radius: 24px;
      --radius-sm: 12px;
      --shadow: 0 10px 30px rgba(28, 27, 27, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--surface);
      color: var(--on-surface);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { font-family: 'Playfair Display', serif; letter-spacing: -0.01em; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; }

    /* Login */
    .login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .login-card {
      background: var(--surface-container-lowest); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 40px; width: 100%; max-width: 400px;
    }
    .brand { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; }
    .brand-sub { color: var(--on-surface-variant); font-size: 14px; margin: 4px 0 28px; }
    label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--on-surface-variant); margin-bottom: 8px; }
    input, select {
      width: 100%; padding: 14px 16px; border: 1px solid var(--outline-variant);
      border-radius: var(--radius-sm); font-family: inherit; font-size: 15px; background: var(--surface-container-low);
      outline: none; transition: border-color .15s;
    }
    input:focus, select:focus { border-color: var(--on-surface); }
    .field { margin-bottom: 18px; }
    button {
      font-family: inherit; cursor: pointer; border: none; font-weight: 500;
      font-size: 14px; letter-spacing: 0.02em; transition: transform .12s, opacity .15s;
    }
    button:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--primary); color: var(--on-primary); padding: 14px 22px;
      border-radius: 999px; width: 100%;
    }
    .btn-ghost {
      background: transparent; border: 1px solid var(--outline-variant); color: var(--on-surface);
      padding: 8px 16px; border-radius: 999px;
    }
    .btn-sm { padding: 8px 14px; border-radius: 999px; font-size: 13px; }
    .btn-danger { background: var(--error); color: #fff; }
    .btn-accent { background: var(--on-surface); color: #fff; }
    .msg { font-size: 13px; margin-top: 14px; min-height: 18px; }
    .msg.error { color: var(--error); }
    .msg.ok { color: var(--success); }

    /* App */
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
    .topbar .brand { font-size: 26px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 40px; }
    .stat-card {
      background: var(--surface-container-lowest); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 24px;
    }
    .stat-num { font-family: 'Playfair Display', serif; font-size: 40px; font-weight: 700; line-height: 1; }
    .stat-label { color: var(--on-surface-variant); font-size: 13px; margin-top: 8px;
      text-transform: uppercase; letter-spacing: 0.06em; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
    .search { max-width: 320px; }
    .panel { background: var(--surface-container-lowest); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 16px 20px; font-size: 14px; border-bottom: 1px solid var(--surface-container-high); }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--on-surface-variant); font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge-premium { background: #2c1600; color: #f0bd8b; }
    .badge-free { background: var(--surface-container-high); color: var(--on-surface-variant); }
    .badge-admin { background: var(--on-surface); color: #fff; }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .grant-inline { display: flex; gap: 6px; align-items: center; }
    .grant-inline input { width: 64px; padding: 8px 10px; }
    .muted { color: var(--on-surface-variant); font-size: 12px; }
    .hidden { display: none !important; }
    .empty { padding: 40px; text-align: center; color: var(--on-surface-variant); }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--on-surface); color: #fff; padding: 14px 24px; border-radius: 999px;
      font-size: 14px; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand">Capsule</div>
      <div class="brand-sub">Панель администратора</div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="admin@capsule.app" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-primary" onclick="login()">Войти</button>
      <div id="loginMsg" class="msg"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="appScreen" class="wrap hidden">
    <div class="topbar">
      <div>
        <div class="brand">Capsule</div>
        <div class="muted" id="whoami"></div>
      </div>
      <button class="btn-ghost" onclick="logout()">Выйти</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="section-head">
      <h2>Пользователи</h2>
      <input id="search" class="search" placeholder="Поиск по email или имени…" oninput="debouncedLoad()" />
    </div>
    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>Пользователь</th>
            <th>Подписка</th>
            <th>Действует до</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="usersBody">
          <tr><td colspan="4" class="empty">Загрузка…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API = '/api';
    let token = localStorage.getItem('capsule_admin_token') || '';

    function headers() {
      return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token };
    }

    async function api(path, options = {}) {
      const res = await fetch(API + path, { ...options, headers: { ...headers(), ...(options.headers || {}) } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Ошибка запроса');
      return data;
    }

    function showToast(text) {
      const t = document.getElementById('toast');
      t.textContent = text;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('loginMsg');
      msg.textContent = ''; msg.className = 'msg';
      try {
        const res = await fetch(API + '/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Ошибка входа');
        if (data.user.role !== 'admin') throw new Error('Недостаточно прав (нужен администратор)');
        token = data.token;
        localStorage.setItem('capsule_admin_token', token);
        enterApp(data.user);
      } catch (e) {
        msg.textContent = e.message; msg.className = 'msg error';
      }
    }

    function logout() {
      token = '';
      localStorage.removeItem('capsule_admin_token');
      document.getElementById('appScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    }

    function enterApp(user) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
      document.getElementById('whoami').textContent = user.email;
      loadStats();
      loadUsers();
    }

    async function loadStats() {
      try {
        const { stats } = await api('/admin/stats');
        const cards = [
          { n: stats.users, l: 'Пользователей' },
          { n: stats.premiumActive, l: 'Premium активно' },
          { n: stats.items, l: 'Вещей' },
          { n: stats.outfits, l: 'Образов' },
          { n: stats.events, l: 'Событий' },
        ];
        document.getElementById('stats').innerHTML = cards
          .map((c) => `<div class="stat-card"><div class="stat-num">${c.n}</div><div class="stat-label">${c.l}</div></div>`)
          .join('');
      } catch (e) {
        if (/токен|прав/i.test(e.message)) logout();
      }
    }

    function fmtDate(d) {
      if (!d) return '—';
      const dt = new Date(d);
      if (dt.getTime() < Date.now()) return '<span class="muted">истекла</span>';
      return dt.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    async function loadUsers() {
      const search = document.getElementById('search').value.trim();
      try {
        const { users } = await api('/admin/users?limit=100&search=' + encodeURIComponent(search));
        const body = document.getElementById('usersBody');
        if (!users.length) {
          body.innerHTML = '<tr><td colspan="4" class="empty">Пользователи не найдены</td></tr>';
          return;
        }
        body.innerHTML = users.map(renderRow).join('');
      } catch (e) {
        if (/токен|прав/i.test(e.message)) logout();
        else showToast(e.message);
      }
    }

    function renderRow(u) {
      const active = u.subscription.active;
      const sub = u.role === 'admin'
        ? '<span class="badge badge-admin">admin</span>'
        : active
          ? '<span class="badge badge-premium">premium</span>'
          : '<span class="badge badge-free">free</span>';
      const name = u.name ? `${u.name}` : '<span class="muted">без имени</span>';
      return `<tr>
        <td><div>${name}</div><div class="muted">${u.email}</div></td>
        <td>${sub}</td>
        <td>${fmtDate(u.subscription.expiresAt)}</td>
        <td>
          <div class="row-actions">
            <div class="grant-inline">
              <input type="number" id="days-${u.id}" value="30" min="1" />
              <button class="btn-sm btn-accent" onclick="grant('${u.id}')">Выдать дни</button>
            </div>
            ${active ? `<button class="btn-sm btn-ghost" onclick="revoke('${u.id}')">Отозвать</button>` : ''}
            ${u.role !== 'admin' ? `<button class="btn-sm btn-ghost" onclick="del('${u.id}','${u.email}')">Удалить</button>` : ''}
          </div>
        </td>
      </tr>`;
    }

    async function grant(id) {
      const days = parseInt(document.getElementById('days-' + id).value, 10);
      try {
        await api('/admin/users/' + id + '/grant', { method: 'POST', body: JSON.stringify({ days }) });
        showToast(`Выдано ${days} дн. Premium`);
        loadUsers(); loadStats();
      } catch (e) { showToast(e.message); }
    }

    async function revoke(id) {
      try {
        await api('/admin/users/' + id + '/revoke', { method: 'POST' });
        showToast('Подписка отозвана');
        loadUsers(); loadStats();
      } catch (e) { showToast(e.message); }
    }

    async function del(id, email) {
      if (!confirm('Удалить пользователя ' + email + ' и все его данные?')) return;
      try {
        await api('/admin/users/' + id, { method: 'DELETE' });
        showToast('Пользователь удалён');
        loadUsers(); loadStats();
      } catch (e) { showToast(e.message); }
    }

    let debounceTimer;
    function debouncedLoad() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(loadUsers, 300);
    }

    // Enter key on login
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !document.getElementById('loginScreen').classList.contains('hidden')) login();
    });

    // Auto-login if token exists
    (async function boot() {
      if (!token) return;
      try {
        const { user } = await api('/auth/me');
        if (user.role === 'admin') enterApp(user);
        else logout();
      } catch { logout(); }
    })();
  </script>
</body>
</html>
